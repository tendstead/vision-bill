services:
  vision_bill:
    build: .
    image: vision-bill:${VB_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PG__HOST: db
      PG__PORT: "5432"
      OCR__SERVICE_URL: http://paddleocr-service:8082
      OCR__TIMEOUT_SECONDS: "900"
    ports:
      - "${API__PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - postgres_net
    depends_on:
      db:
        condition: service_healthy
      paddleocr-service:
        condition: service_healthy
    volumes:
      - ./server_data/logs:/app/logs
      - ./server_data/uploads:/app/uploads
      - ./server_data/config:/app/config

  paddleocr-service:
    build: ./paddleocr-service
    container_name: paddleocr-service
    restart: always
    environment:
      OMP_NUM_THREADS: "4"
      OCR_PORT: "8082"
      OCR_TIMEOUT_SECONDS: "900"
    volumes:
      - ./server_data/ocr-models:/root/.paddleocr/models
    networks:
      - postgres_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:18
    container_name: postgres
    pull_policy: always # re-pull latest 18.x tag whenever `docker compose up` runs
    restart: unless-stopped # auto-start on host/Docker reboot
    environment:
      POSTGRES_USER: ${PG__USER}
      POSTGRES_PASSWORD: ${PG__PASSWORD}
      POSTGRES_DB: ${PG__DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    networks:
      - postgres_net
    # No `ports:` section on purpose - nothing is published to the NAS host.
    # Other containers reach this one only via the internal `postgres_net`
    # network, at hostname "postgres", port 5432.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=80
      - -c
      - wal_compression=on
      - -c
      - log_connections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG__USER} -d ${PG__DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:

networks:
  postgres_net:
    name: postgres_net
    driver: bridge
