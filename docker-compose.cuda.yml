# The selected GPU profile starts a controller that waits for explicit setup.
services:
  vision_bill:
    environment:
      VISION_BILL_OCR_ACTIVATION: "true"
      OCR_ACTIVATION_ENDPOINT: http://paddleocr-service:8082
      OCR_ACTIVATION_HANDOFF_LOCK_PATH: /coord/gpu-handoff.lock
    volumes:
      - ocr-activation-request:/activation/request
      - ocr-activation-status:/activation/status:ro
      - ocr-activation-lock:/activation/lock
      - ocr-coordination:/coord
    networks:
      - default
  paddleocr-service:
    build:
      context: ./paddleocr-service
      dockerfile: Dockerfile.cuda
      additional_contexts:
        cuda-wheel: "${OCR_CUDA_WHEEL_CONTEXT:-./paddleocr-service/empty-wheel-context}"
      args:
        OCR_CUDA_CHANNEL: "${OCR_CUDA_CHANNEL:-cu129}"
    image: vision-bill-ocr-cuda:${OCR_IMAGE_TAG:-candidate}
    command: ["python", "-m", "ocr_service.activation"]
    environment:
      OCR_IMAGE_ID: "${OCR_IMAGE_ID:-}"
      OCR_HANDOFF_LOCK_PATH: /coord/gpu-handoff.lock
      OCR_STATE_DIR: /var/lib/ocr
      OCR_RUNTIME_SETTINGS_PATH: ""
      OCR_QUALIFICATION_IMAGE_PATH: ""
    volumes:
      - ocr-activation-request:/activation/request:ro
      - ocr-activation-status:/activation/status
      - ocr-activation-lock:/activation/lock
      - ocr-coordination:/coord
      - ocr-state:/var/lib/ocr
      - ocr-cache:/var/cache/paddlex
      - ${OCR_RELEASE_DIR:-./server_data/ocr-release}:/release:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OCR_CUDA_DEVICE_ID:-0}"]
              capabilities: [gpu]

volumes:
  ocr-activation-request:
  ocr-activation-status:
  ocr-activation-lock:
  ocr-coordination:
  ocr-state:
  ocr-cache:
