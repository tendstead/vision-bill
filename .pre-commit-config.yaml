# Pre-commit hooks for vision-bill.
#
# Install pre-commit itself on the host with:
#   pipx install pre-commit
#
# All hooks are local: Go, Docker (for the throwaway PostgreSQL used by the
# integration tests) and Node/nvm (for the frontend hook) must be on PATH.
repos:
  - repo: local
    hooks:
      - id: lint
        name: Lint (gofmt + go vet)
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
      - id: test
        name: Go tests (race detector, PostgreSQL)
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
      - id: frontend-verify
        name: Frontend checks, tests, and build
        entry: make fe-verify
        language: system
        pass_filenames: false
        always_run: true
