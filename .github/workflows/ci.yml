name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer run for the same ref supersedes the queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint + unit tests + frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: make fe-install
      - name: Release driver tests (no publication)
        run: make release-test
      - name: Lint + type check
        run: make lint
      - name: Unit tests
        run: make test
      - name: Frontend check + unit tests + build
        run: make fe-verify

  e2e-backend:
    name: E2E backend (compose stack + LLM stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Builds the multi-stage app image, boots the stack, runs pytest
      # tests/e2e/, and tears the stack down (all handled by the target).
      - name: Run backend e2e
        run: make test-e2e

  e2e-frontend:
    name: E2E frontend (Playwright + compose stack + LLM stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: make fe-install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium (+ system deps)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Boots the stack, runs playwright test, and tears the stack down
      # (all handled by the target).
      - name: Run frontend e2e
        run: make fe-test-e2e
