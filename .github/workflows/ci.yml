name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer run for the same ref supersedes the queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint + unit tests + frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          # Only this job saves the shared uv cache.
          save-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: make fe-install
      - name: Release driver tests (no publication)
        run: make release-test
      - name: Prebuilt distribution tests (CPU, no publication)
        run: make distribution-test
      - name: Native coordinator as actual PID1 (CPU, no GPU or model weights)
        run: make distribution-pid1-test
      - name: Lint + type check
        run: make lint
      - name: Validate deployment Compose overlays (CPU, no services)
        run: make compose-check
      - name: Unit tests
        run: make test
      - name: Frontend check + unit tests + build
        run: make fe-verify

  e2e-backend:
    name: E2E backend (compose stack + LLM stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          save-cache: false
      # Builds the multi-stage app image, boots the stack, runs pytest
      # tests/e2e/, and tears the stack down (all handled by the target).
      - name: Run backend e2e
        run: make test-e2e

  e2e-frontend:
    name: E2E frontend (Playwright + compose stack + LLM stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          save-cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: make fe-install
      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright Chromium (+ system deps)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Boots the stack, runs playwright test, and tears the stack down
      # (all handled by the target).
      - name: Run frontend e2e
        run: make fe-test-e2e
