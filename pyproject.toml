[project]
name = "vision-bill"
version = "0.0.1"
description = "Invoice tracking API with LLM capabilities"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "ollama>=0.6.2",
    "Pillow>=10.4.0",
    "pillow-heif>=0.16.0",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0",
    "pytest>=9.1.1",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "stream-zip>=0.0.84",
    "uvicorn>=0.47.0",
    "openai>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "httpx2>=2.0.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_bill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "tests", "."]
markers = ["e2e: end-to-end tests requiring the docker-compose.e2e.yml stack"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true
