# Tooling for the black-box API end-to-end suite in tests/e2e (the application
# itself is Go; see go.mod). Run with `make test-e2e`.
[project]
name = "vision-bill-e2e"
version = "0.0.0"
description = "Black-box API end-to-end tests for Vision Bill"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["tests"]
markers = ["e2e: end-to-end tests requiring the docker-compose.e2e.yml stack"]
